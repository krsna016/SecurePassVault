<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass Vault</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="glass-card">
                <div class="logo-container">
                    <div class="glow-orb"></div>
                    <h1>SecurePass</h1>
                </div>
                <p class="subtitle">Zero-Knowledge Local Encryption</p>
                
                <div class="input-group">
                    <input type="password" id="master-password" placeholder="Enter Master Password" autocomplete="off">
                    <div class="focus-border"></div>
                </div>
                
                <button id="unlock-btn" class="primary-btn">
                    <span class="btn-text">Unlock Vault</span>
                    <div class="btn-glow"></div>
                </button>
                <p class="warning-text">If you forget this password, your data is lost forever.</p>
                <button id="reset-vault-btn" class="text-btn" style="margin-top: 10px; color: var(--danger); width: 100%;">Factory Reset Vault</button>
            </div>
        </div>

        <!-- Vault Screen -->
        <div id="vault-screen" class="screen">
            <header>
                <h2>My Vault</h2>
                <button id="lock-btn" class="secondary-btn">Lock</button>
            </header>

            <div class="toolbar">
                <input type="text" id="search-input" placeholder="Search passwords...">
                <button id="add-new-btn" class="primary-btn small-btn">+ Add New</button>
            </div>

            <div class="password-list" id="password-list">
                <!-- Dynamic Content goes here -->
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="modal-overlay" class="hidden">
            <div class="glass-card modal">
                <h3 id="modal-title">Add New Credential</h3>
                
                <div class="input-group">
                    <label>Platform (e.g. Google)</label>
                    <input type="text" id="entry-platform" autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label>Username / Email</label>
                    <input type="text" id="entry-username" autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="entry-password" autocomplete="off">
                        <button id="generate-pwd-btn" class="text-btn">Generate</button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="cancel-btn" class="secondary-btn">Cancel</button>
                    <button id="save-btn" class="primary-btn">Save Encrypted</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
